<svg xmlns="http://www.w3.org/2000/svg" width="140" height="20" viewBox="0 0 140 20" role="img" aria-label="Coverage: in progress" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title>Coverage: in progress</title>
  <defs><clipPath id="badge-clip"><rect width="140" height="20" rx="3"/></clipPath></defs>
  <g clip-path="url(#badge-clip)">
    <rect width="60" height="20" fill="#30363D"/>
    <rect x="60" width="80" height="20" fill="#DDF4FF"/>
  </g>
  <rect x="0.5" y="0.5" width="139" height="19" rx="2.5" fill="none" stroke="#D0D7DE"/>
  <g font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11" text-anchor="middle">
    <text x="30" y="14" fill="#F0F6FC">Coverage</text>
    <text x="100" y="14" fill="#0550AE">in progress</text>
  </g>
</svg>
