openapi: 3.1.0
info:
  title: DOT Registry Anchor Read API
  version: 1.0.0
  description: |
    Version 1 consumer contract for reading raw and resolved DOT Anchors.
    Resolved responses normalize the operation selected from an authoritative
    OpenAPI, AsyncAPI, Protobuf, or GraphQL Contract without copying its payload.
    Runtime endpoints, credentials, wires, and policy are outside this API.
tags:
  - name: Anchors
paths:
  /dots/{dotId}/anchors:
    parameters:
      - $ref: '#/components/parameters/DotId'
    get:
      tags: [Anchors]
      operationId: listAnchors
      summary: List the raw Anchors declared by a DOT
      responses:
        '200':
          description: Anchors in declaration order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Anchor'
        '404':
          $ref: '#/components/responses/NotFound'
  /dots/{dotId}/anchors/resolved:
    parameters:
      - $ref: '#/components/parameters/DotId'
    get:
      tags: [Anchors]
      operationId: listResolvedAnchors
      summary: List Anchors with normalized selected Contract elements
      responses:
        '200':
          description: Resolved Anchors in declaration order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResolvedAnchor'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
  /dots/{dotId}/anchors/{anchorId}:
    parameters:
      - $ref: '#/components/parameters/DotId'
      - $ref: '#/components/parameters/AnchorId'
    get:
      tags: [Anchors]
      operationId: getAnchor
      summary: Read one raw Anchor by stable UUID
      responses:
        '200':
          description: The requested Anchor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Anchor'
        '404':
          $ref: '#/components/responses/NotFound'
  /dots/{dotId}/anchors/{anchorId}/resolved:
    parameters:
      - $ref: '#/components/parameters/DotId'
      - $ref: '#/components/parameters/AnchorId'
    get:
      tags: [Anchors]
      operationId: getResolvedAnchor
      summary: Read one Anchor with its normalized selected Contract element
      responses:
        '200':
          description: The requested resolved Anchor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedAnchor'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
components:
  parameters:
    DotId:
      name: dotId
      in: path
      required: true
      description: Stable DOT UUID
      schema:
        type: string
        format: uuid
    AnchorId:
      name: anchorId
      in: path
      required: true
      description: Stable Anchor UUID within the DOT
      schema:
        type: string
        format: uuid
  responses:
    NotFound:
      description: The DOT, Anchor, or referenced Contract does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnprocessableContent:
      description: The Contract or selector cannot be resolved safely
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    Anchor:
      oneOf:
        - $ref: '#/components/schemas/ContractBackedAnchor'
        - $ref: '#/components/schemas/ContractlessAnchor'
    AnchorCommon:
      type: object
      required: [id, name, role, semanticTypes]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          description: Descriptive name; not stable identity
        role:
          type: string
          enum: [PROVIDES, REQUIRES]
        semanticTypes:
          type: array
          items:
            type: string
            format: uri
    ContractBackedAnchor:
      allOf:
        - $ref: '#/components/schemas/AnchorCommon'
        - type: object
          required: [contract]
          properties:
            contract:
              $ref: '#/components/schemas/AnchorContract'
            direction:
              type: 'null'
            protocols:
              type: array
              maxItems: 0
            mediaTypes:
              type: array
              maxItems: 0
    ContractlessAnchor:
      allOf:
        - $ref: '#/components/schemas/AnchorCommon'
        - type: object
          required: [direction, protocols, mediaTypes]
          properties:
            contract:
              type: 'null'
            direction:
              type: string
              enum: [INGRESS, EGRESS, BIDIRECTIONAL]
            protocols:
              type: array
              minItems: 1
              items:
                type: string
                minLength: 1
            mediaTypes:
              type: array
              minItems: 1
              items:
                type: string
                minLength: 1
    AnchorContract:
      type: object
      required: [id, selector]
      properties:
        id:
          type: string
          format: uuid
        selector:
          type: string
          minLength: 1
          description: Selector interpreted according to the referenced Contract standard
    ResolvedAnchor:
      type: object
      required: [apiVersion, anchor, contract, selectedElement]
      properties:
        apiVersion:
          type: string
          const: '1'
        anchor:
          $ref: '#/components/schemas/Anchor'
        contract:
          oneOf:
            - $ref: '#/components/schemas/ResolvedContract'
            - type: 'null'
        selectedElement:
          oneOf:
            - $ref: '#/components/schemas/ResolvedContractElement'
            - type: 'null'
    ResolvedContract:
      type: object
      required: [id, name, version, standard, format]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: string
          description: Semantic version or the special latest selector
        standard:
          type: string
          enum: [OPENAPI, ASYNCAPI, PROTOBUF, GRAPHQL]
        format:
          type: string
          enum: [YAML, JSON, PROTOBUF, GRAPHQL]
    ResolvedContractElement:
      type: object
      required:
        - selector
        - identifier
        - interaction
        - protocols
        - mediaTypes
        - inputSchemas
        - outputSchemas
        - securitySchemes
      properties:
        selector:
          type: string
        identifier:
          type: string
        interaction:
          type: string
        protocols:
          type: array
          items:
            type: string
        mediaTypes:
          type: array
          items:
            type: string
        inputSchemas:
          type: array
          items:
            type: string
        outputSchemas:
          type: array
          items:
            type: string
        securitySchemes:
          type: array
          items:
            type: string
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - DOT_NOT_FOUND
            - ANCHOR_NOT_FOUND
            - CONTRACT_NOT_FOUND
            - INVALID_CONTRACT
            - INVALID_SELECTOR
            - SELECTOR_NOT_FOUND
            - UNSUPPORTED_CONTRACT_FEATURE
        message:
          type: string
